# Évite la mise en pause du projet Supabase gratuit (7 jours sans activité).
# Une requête de lecture toute simple est envoyée tous les 3 jours, avec la clé publique de config.js.
name: Garder Supabase éveillé
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Requête de lecture
        run: |
          URL=$(grep -o 'SUPABASE_URL: *"[^"]*"' config.js | sed 's/.*"\(.*\)"/\1/')
          KEY=$(grep -o 'SUPABASE_ANON_KEY: *"[^"]*"' config.js | sed 's/.*"\(.*\)"/\1/')
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/vendeurs?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Réponse de Supabase : $CODE"
          test "$CODE" = "200"
